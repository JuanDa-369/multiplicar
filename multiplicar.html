<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14332b">
  <title>Tablas de Multiplicar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="multiplicar.css">
</head>
<body>

  <!-- Símbolos matemáticos flotantes (decorativos) -->
  <div class="simbolos" aria-hidden="true">
    <span class="s s1">+</span>
    <span class="s s2">&times;</span>
    <span class="s s3">&divide;</span>
    <span class="s s4">&pi;</span>
    <span class="s s5">&radic;</span>
    <span class="s s6">=</span>
    <span class="s s7">&sum;</span>
    <span class="s s8">&minus;</span>
    <span class="s s9">5</span>
    <span class="s s10">&infin;</span>
    <span class="s s11">&times;</span>
    <span class="s s12">%</span>
  </div>

  <!-- Header fijo con controles -->
  <header class="header" role="banner">
    <div class="header-inner">

      <span class="header-label">Tabla del</span>

      <div class="input-wrap">
        <span class="input-icon">✕</span>
        <input
          type="number"
          id="txtNumero"
          placeholder="5"
          min="1"
          max="999"
          aria-label="Número para la tabla"
        >
      </div>

      <nav class="quick-nums" aria-label="Accesos rápidos">
        <button class="qn" data-n="2">2</button>
        <button class="qn" data-n="3">3</button>
        <button class="qn" data-n="4">4</button>
        <button class="qn" data-n="5">5</button>
        <button class="qn" data-n="6">6</button>
        <button class="qn" data-n="7">7</button>
        <button class="qn" data-n="8">8</button>
        <button class="qn" data-n="9">9</button>
        <button class="qn" data-n="10">10</button>
        <button class="qn" data-n="12">12</button>
      </nav>

      <button class="btn-generar" onclick="generarTabla()">GENERAR</button>

    </div>
  </header>

  <!-- Contenido principal -->
  <main class="main">

    <p  class="hero-formula" id="heroFormula" aria-hidden="true">5 &times; n = ?</p>
    <h1 class="hero-titulo"  id="heroTitulo">Tablas de multiplicar</h1>
    <p  class="hero-sub"     id="heroSub"></p>

    <section class="pizarra" aria-label="Tabla de multiplicar" id="pizarra">
      <table>
        <thead>
          <tr>
            <th scope="col">Operación</th>
            <th scope="col">Resultado</th>
          </tr>
        </thead>
        <tbody id="divTabla"></tbody>
      </table>
    </section>

    <div class="datos-pie" id="datosPie" aria-live="polite"></div>

  </main>

  <footer class="footer">
    <p>Creado por: <strong>Juan David Llibri</strong></p>
  </footer>

  <script src="multiplicar.js"></script>
</body>
</html>
